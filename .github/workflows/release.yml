name: Release
run-name: Release ${{ github.ref_name }}
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_only:
        description: Build and package without publishing a GitHub release
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2; exit 1; }
      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - name: Install Linux build dependencies
        if: startsWith(matrix.runner, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libxcb1-dev libxkbcommon-dev libwayland-dev libgtk-3-dev
      - name: Build
        shell: bash
        run: cargo build --release --locked --bin minerve --target ${{ matrix.target }}
      - name: Smoke test binary
        shell: bash
        run: target/${{ matrix.target }}/release/minerve --help
      - name: Package
        shell: bash
        run: sh scripts/release/publish-flow.sh ${{ matrix.target }} target/${{ matrix.target }}/release/minerve dist
      - uses: actions/upload-artifact@v4
        with:
          name: minerve-${{ matrix.target }}
          path: dist/minerve-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 7
  publish:
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.build_only
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          cp install.sh dist/install.sh
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
