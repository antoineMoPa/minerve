[workspace]
members = [".", "gateway"]

[package]
name = "minerve"
version = "0.7.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "io-util", "time"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
dotenvy = "0.15"
dirs = "6.0.0"
smol = "2.0.2"
ratatui = "0.29"
unicode-width = "0.2.0"
regex = "1.11.1"
async-trait = "0.1.88"
clap = { version = "4.5.40", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rmcp = { version = "3.8", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "auth", "reqwest"] }
# rmcp's HTTP transport and OAuth take a reqwest 0.13 client; the rest of minerve is still on 0.11.
reqwest_rmcp = { package = "reqwest", version = "0.13", default-features = false }
http = "1"
minerve-gateway = { path = "gateway" }
libc = "0.2"
